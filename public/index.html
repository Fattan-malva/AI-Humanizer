<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malva — AI Humanizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0e0c09;
            --bg2: #141210;
            --bg3: #1c1916;
            --border: #2a2520;
            --border2: #332e28;
            --gold: #c9a84c;
            --gold2: #e8c96a;
            --gold-dim: rgba(201, 168, 76, 0.12);
            --gold-glow: rgba(201, 168, 76, 0.06);
            --text: #f0ebe2;
            --text2: #b8ad9e;
            --text3: #7a7168;
            --user-bg: #1a1710;
            --ai-bg: #111009;
            --red: #c44;
            --green: #5a9;
            --radius: 2px;
            --font-serif: 'DM Serif Display', Georgia, serif;
            --font-body: 'Lora', Georgia, serif;
            --font-mono: 'DM Mono', monospace;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.75;
            overflow: hidden;
        }

        /* ── Layout ── */
        .app {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 32px;
            border-bottom: 1px solid var(--border);
            background: var(--bg2);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .logo-name {
            font-family: var(--font-serif);
            font-size: 22px;
            color: var(--gold2);
            letter-spacing: 0.04em;
        }

        .logo-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text3);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border: 1px solid var(--border2);
            padding: 2px 7px;
            border-radius: 2px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text3);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ── Messages ── */
        .messages {
            overflow-y: auto;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 2px;
        }

        /* ── Welcome ── */
        .welcome {
            text-align: center;
            padding: 60px 20px 20px;
            animation: fadeUp 0.6s ease both;
        }

        .welcome-icon {
            font-size: 32px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 12px var(--gold));
        }

        .welcome h2 {
            font-family: var(--font-serif);
            font-size: 26px;
            color: var(--gold2);
            font-weight: 400;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--text3);
            font-size: 14px;
            max-width: 380px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .welcome-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px auto;
            max-width: 240px;
            color: var(--text3);
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.1em;
        }

        .welcome-divider::before,
        .welcome-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border2);
        }

        /* ── Message Bubble ── */
        .msg {
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeUp 0.35s ease both;
            max-width: 820px;
        }

        .msg.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text3);
            letter-spacing: 0.06em;
        }

        .msg-label {
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .msg-time {
            opacity: 0.6;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: var(--radius);
            position: relative;
            line-height: 1.8;
            font-size: 14.5px;
        }

        .msg.user .msg-bubble {
            background: var(--user-bg);
            border: 1px solid var(--border2);
            color: var(--text);
            border-bottom-right-radius: 0;
        }

        .msg.ai .msg-bubble {
            background: var(--ai-bg);
            border: 1px solid var(--border);
            border-left: 2px solid var(--gold);
            color: var(--text);
            border-bottom-left-radius: 0;
        }

        .msg.ai .msg-bubble::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gold-glow);
            pointer-events: none;
        }

        /* AI response text formatting */
        .msg-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-text a {
            color: var(--gold2);
            text-decoration: underline;
            text-decoration-color: rgba(201, 168, 76, 0.4);
            transition: all 0.15s;
        }

        .msg-text a:hover {
            color: var(--gold);
            text-decoration-color: var(--gold);
        }

        .msg-text i, .msg-text em {
            font-style: italic;
            color: var(--gold2);
        }

        /* ── Message Actions ── */
        .msg-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .msg:hover .msg-actions {
            opacity: 1;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--bg3);
            border: 1px solid var(--border2);
            color: var(--text3);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.15s;
            letter-spacing: 0.05em;
        }

        .action-btn:hover {
            color: var(--gold);
            border-color: var(--gold);
            background: var(--gold-dim);
        }

        .action-btn.copied {
            color: var(--green);
            border-color: var(--green);
        }

        .action-btn svg {
            flex-shrink: 0;
        }

        /* ── Edit Mode ── */
        .msg-edit {
            width: 100%;
            min-width: 340px;
            max-width: 700px;
            background: var(--bg3);
            border: 1px solid var(--gold);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 14px;
            line-height: 1.75;
            padding: 12px 14px;
            resize: vertical;
            border-radius: var(--radius);
            outline: none;
            box-shadow: 0 0 0 2px var(--gold-dim);
        }

        .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .edit-save {
            background: var(--gold);
            color: var(--bg);
            border: none;
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 5px 14px;
            cursor: pointer;
            border-radius: 2px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 500;
            transition: opacity 0.15s;
        }

        .edit-save:hover {
            opacity: 0.85;
        }

        .edit-cancel {
            background: transparent;
            border: 1px solid var(--border2);
            color: var(--text3);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 5px 14px;
            cursor: pointer;
            border-radius: 2px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: all 0.15s;
        }

        .edit-cancel:hover {
            border-color: var(--text3);
            color: var(--text);
        }

        /* ── Typing indicator ── */
        .typing-bubble {
            background: var(--ai-bg);
            border: 1px solid var(--border);
            border-left: 2px solid var(--gold);
            padding: 14px 20px;
            display: flex;
            gap: 5px;
            align-items: center;
            border-radius: var(--radius);
        }

        .typing-dot {
            width: 5px;
            height: 5px;
            background: var(--gold);
            border-radius: 50%;
            animation: blink 1.2s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ── Input Area ── */
        .input-area {
            padding: 20px 32px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg2);
            position: relative;
        }

        .input-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.25;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            max-width: 860px;
            margin: 0 auto;
        }

        .input-box {
            flex: 1;
            background: var(--bg3);
            border: 1px solid var(--border2);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 14.5px;
            line-height: 1.7;
            padding: 12px 16px;
            border-radius: var(--radius);
            resize: none;
            outline: none;
            max-height: 200px;
            min-height: 50px;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow-y: auto;
        }

        .input-box:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 2px var(--gold-dim);
        }

        .input-box::placeholder {
            color: var(--text3);
        }

        .send-btn {
            background: var(--gold);
            border: none;
            color: var(--bg);
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.15s, transform 0.1s;
        }

        .send-btn:hover:not(:disabled) {
            opacity: 0.85;
            transform: scale(1.04);
        }

        .send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .input-hint {
            text-align: center;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text3);
            margin-top: 10px;
            letter-spacing: 0.06em;
        }

        kbd {
            background: var(--bg3);
            border: 1px solid var(--border2);
            padding: 1px 5px;
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 9px;
        }

        /* ── Error ── */
        .error-msg {
            background: rgba(204, 68, 68, 0.08);
            border: 1px solid rgba(204, 68, 68, 0.3);
            border-left: 2px solid var(--red);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            color: #e88;
        }

        /* ── Animations ── */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Scrollbar ── */
        textarea::-webkit-scrollbar {
            width: 3px;
        }

        textarea::-webkit-scrollbar-thumb {
            background: var(--border2);
        }
    </style>
</head>

<body>
    <div class="app">

        <!-- Header -->
        <header>
            <div class="logo">
                <span class="logo-name">Malva</span>
                <span class="logo-tag">AI Humanizer</span>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                <span>Online</span>
            </div>
        </header>

        <!-- Messages -->
        <div class="messages" id="messages">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">✦</div>
                <h2>Malva Humanizer</h2>
                <p>Transformasi teks AI menjadi tulisan akademik yang natural, terasa seperti ditulis oleh manusia.</p>
                <div class="welcome-divider">mulai percakapan</div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="input" class="input-box" placeholder="Tempel teks AI di sini untuk di-humanize..."
                    rows="2"></textarea>
                <button class="send-btn" id="sendBtn" title="Kirim">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="input-hint"><kbd>Enter</kbd> kirim &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> baris baru</div>
        </div>

    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');

        let isLoading = false;

        function getTime() {
            return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function removeWelcome() {
            const w = document.getElementById('welcome');
            if (w) w.remove();
        }

        // ── Render a message ──
        function renderMessage(role, text) {
            removeWelcome();
            const id = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2);
            const labelMap = { user: 'Anda', ai: 'Malva' };
            const label = labelMap[role];

            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.id = id;
            div.dataset.text = text;

            // AI messages render HTML (italic, links), user messages are escaped
            const contentHtml = role === 'ai' ? text : escapeHtml(text);

            div.innerHTML = `
      <div class="msg-meta">
        <span class="msg-label">${label}</span>
        <span class="msg-time">${getTime()}</span>
      </div>
      <div class="msg-bubble">
        <div class="msg-text">${contentHtml}</div>
      </div>
      <div class="msg-actions">
        ${role === 'ai' ? `
        <button class="action-btn copy-btn" title="Salin teks">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Salin
        </button>` : ''}
        <button class="action-btn edit-btn" title="Edit pesan">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit
        </button>
        ${role === 'user' ? `
        <button class="action-btn copy-btn" title="Salin teks">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Salin
        </button>` : ''}
      </div>
    `;

            // Copy handler
            div.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(div.dataset.text).then(() => {
                        btn.classList.add('copied');
                        btn.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            Tersalin
          `;
                        setTimeout(() => {
                            btn.classList.remove('copied');
                            btn.innerHTML = `
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Salin
            `;
                        }, 2000);
                    });
                });
            });

            // Edit handler
            div.querySelector('.edit-btn')?.addEventListener('click', () => {
                startEdit(div);
            });

            messagesEl.appendChild(div);
            scrollToBottom();
            return div;
        }

        // ── Edit mode ──
        function startEdit(msgDiv) {
            const bubble = msgDiv.querySelector('.msg-bubble');
            const originalText = msgDiv.dataset.text;

            bubble.innerHTML = `
      <textarea class="msg-edit" rows="5">${escapeHtml(originalText)}</textarea>
      <div class="edit-actions">
        <button class="edit-save">Simpan</button>
        <button class="edit-cancel">Batal</button>
      </div>
    `;

            const ta = bubble.querySelector('.msg-edit');
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);

            bubble.querySelector('.edit-save').addEventListener('click', () => {
                const newText = ta.value.trim();
                if (!newText) return;
                msgDiv.dataset.text = newText;
                bubble.innerHTML = `<div class="msg-text">${escapeHtml(newText)}</div>`;
            });

            bubble.querySelector('.edit-cancel').addEventListener('click', () => {
                bubble.innerHTML = `<div class="msg-text">${escapeHtml(originalText)}</div>`;
            });
        }

        // ── Typing indicator ──
        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.id = 'typing';
            div.innerHTML = `
      <div class="msg-meta"><span class="msg-label">Malva</span></div>
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    `;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function hideTyping() {
            document.getElementById('typing')?.remove();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });
        }

        // ── Send message ──
        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';

            renderMessage('user', text);
            showTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });

                const data = await res.json();
                hideTyping();

                if (!res.ok || data.error) {
                    const errDiv = document.createElement('div');
                    errDiv.className = 'msg ai';
                    errDiv.innerHTML = `
          <div class="msg-meta"><span class="msg-label">Error</span></div>
          <div class="error-msg">${escapeHtml(data.error || 'Terjadi kesalahan.')}</div>
        `;
                    messagesEl.appendChild(errDiv);
                } else {
                    renderMessage('ai', data.reply);
                }
            } catch (err) {
                hideTyping();
                const errDiv = document.createElement('div');
                errDiv.className = 'msg ai';
                errDiv.innerHTML = `
        <div class="msg-meta"><span class="msg-label">Error</span></div>
        <div class="error-msg">Gagal terhubung ke server. Pastikan server berjalan.</div>
      `;
                messagesEl.appendChild(errDiv);
                scrollToBottom();
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        // ── Events ──
        sendBtn.addEventListener('click', sendMessage);

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
        });

        // Focus on load
        inputEl.focus();
    </script>
</body>

</html>
